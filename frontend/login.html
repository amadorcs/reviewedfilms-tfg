<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - ReviewedFilms</title>

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="header">
        <div class="logo"> <a href="index.html">ReviewedFilms</a> </div>

        <nav class="nav"> <a href="register.html">Registrarse</a> </nav>
    </header>

    <main class="auth-container">
        <form class="auth-card" onsubmit="loginUser(event)">

            <h1>Iniciar sesión</h1>

            <label for="username">Usuario</label>
            <input
                type="text"
                id="username"
                placeholder="Nombre del usuario"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                placeholder="Contraseña del usuario"
                required
            >

            <button type="submit">Iniciar sesión</button>

            <p>
                ¿No tienes cuenta?
                <a href="register.html"> Registrarse </a>
            </p>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-links">
            <a href="index.html">Inicio</a>
            <a href="films.html">Películas</a>
        </div>

        <p>ReviewedFilms - TFG - 2026</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
