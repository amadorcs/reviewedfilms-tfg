services:

  db:
    image: postgres:16-alpine
    container_name: reviewedfilms_db

    environment:
      POSTGRES_USER: reviewedfilms_user
      POSTGRES_PASSWORD: reviewedfilms_password
      POSTGRES_DB: reviewedfilms_db

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U reviewedfilms_user -d reviewedfilms_db"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build: ./backend
    container_name: reviewedfilms_backend

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    depends_on:
      db:
        condition: service_healthy

    volumes:
      - ./backend:/app


volumes:
  postgres_data: